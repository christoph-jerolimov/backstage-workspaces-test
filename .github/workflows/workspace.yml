name: Workspace

on:
  workflow_call:
    inputs:
      workspace:
        description: Name of the folder in workspaces/ to build and verify
        required: true
        type: string

permissions:
  contents: read

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: workspaces/${{ inputs.workspace }}
    env:
      CI: true
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: yarn
          cache-dependency-path: workspaces/${{ inputs.workspace }}/yarn.lock

      - name: Install dependencies
        id: install
        run: yarn install --immutable

      - name: Type check
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: yarn tsc:full

      - name: Lint
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: yarn lint:all

      - name: Prettier
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: yarn prettier:check

      - name: Test
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: yarn test

      - name: Build
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: yarn build:all
